name: Multi-language CI

on:
  push:
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      language: ${{ steps.readlang.outputs.language }}
    steps:
      - uses: actions/checkout@v4
      - id: readlang
        run: |
          if [ ! -f LANGUAGE ]; then
            echo "LANGUAGE file missing."
            echo "language=invalid" >> $GITHUB_OUTPUT
            exit 0
          fi
          lang=$(tr '[:upper:]' '[:lower:]' < LANGUAGE | xargs)
          case "$lang" in
            python|java|c)
              echo "language=$lang" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Invalid LANGUAGE value: $lang"
              echo "language=invalid" >> $GITHUB_OUTPUT
              ;;
          esac

  guard:
    needs: detect
    if: needs.detect.outputs.language == 'invalid'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Create a LANGUAGE file at repo root with 'python', 'java', or 'c' (lowercase)."
          exit 1

  python-tests:
    needs: detect
    if: needs.detect.outputs.language == 'python'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  java-tests:
    needs: detect
    if: needs.detect.outputs.language == 'java'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run Java tests
        run: |
          javac MinRefuelStops.java TestMinRefuelStops.java
          java TestMinRefuelStops

  c-tests:
    needs: detect
    if: needs.detect.outputs.language == 'c'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C tests
        run: |
          gcc -O2 -std=c11 -o test_min_refuel min_refuel.c test_min_refuel.c
          ./test_min_refuel
